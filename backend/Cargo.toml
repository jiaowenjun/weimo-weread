[package]
name = "weimo-weread"
version = "0.1.0"
edition = "2021"
description = "微信读书官方 Agent Gateway 笔记服务（HTTP 服务器 + 管理后台）"
license = "MIT"

[lib]
name = "weimo_weread"
path = "src/lib.rs"

[[bin]]
name = "weimo-weread-server"
path = "src/bin/weimo-weread-server.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["json"] }
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tower = "0.5"

[profile.release]
strip = true
