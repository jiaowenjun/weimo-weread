[package]
name = "weread-notes"
version = "0.1.0"
edition = "2021"
description = "微信读书官方 Agent Gateway 工具（CLI + 服务器）"
license = "MIT"

[lib]
name = "weread_notes"
path = "src/lib.rs"

[[bin]]
name = "weread-notes"
path = "src/bin/weread-notes.rs"

[[bin]]
name = "weread-notes-server"
path = "src/bin/weread-notes-server.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json"] }
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tower = "0.5"

[profile.release]
strip = true
